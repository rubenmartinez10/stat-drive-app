name: reentrenar
on:
  schedule:
    - cron: "0 9 * * *"      # 3:00 a.m. hora de El Salvador
  workflow_dispatch:
permissions:
  contents: write
jobs:
  entrenar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas numpy
      - run: python train.py
        env:
          FORM_CSV_URL: ${{ secrets.FORM_CSV_URL }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add model.json
          git diff --staged --quiet || git commit -m "modelo $(date -u +%F)"
          git push
