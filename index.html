<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STAT-DRIVE · ¿Cuánto tardo?</title>
<style>
:root{--tx:#1D1D1F;--ladrillo:#B5472B;--navy:#1B2A49;--gris:#F5F5F7;--mut:#6E6E73}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);background:var(--gris);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
padding:max(20px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));overflow-x:hidden}

/* Fondo con orbes naranjas calibrados para laptop y móvil */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--gris)}
.orb{position:absolute;border-radius:50%;filter:blur(75px);will-change:transform}
.orb-1{width:460px;height:460px;top:-110px;left:-90px;background:rgba(196,78,46,.32);animation:float1 16s ease-in-out infinite alternate}
.orb-2{width:440px;height:440px;top:26%;right:-120px;background:rgba(235,128,82,.34);animation:float2 20s ease-in-out infinite alternate}
.orb-3{width:500px;height:500px;bottom:-150px;left:10%;background:rgba(181,71,43,.24);animation:float3 18s ease-in-out infinite alternate}

/* Ajuste específico para pantallas de teléfono (evita saturación OLED y efecto beige) */
@media(max-width:600px){
  .orb{filter:blur(60px)}
  .orb-1{width:65vw;height:65vw;top:-8%;left:-18%;background:rgba(196,78,46,.22)}
  .orb-2{width:62vw;height:62vw;top:32%;right:-22%;background:rgba(235,128,82,.24)}
  .orb-3{width:70vw;height:70vw;bottom:-10%;left:-5%;background:rgba(181,71,43,.17)}
}

@keyframes float1{0%{transform:translate(0,0) scale(1)}100%{transform:translate(50px,70px) scale(1.12)}}
@keyframes float2{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-55px,55px) scale(1.1)}}
@keyframes float3{0%{transform:translate(0,0) scale(1)}100%{transform:translate(45px,-60px) scale(1.14)}}

main{max-width:440px;margin:0 auto;display:grid;gap:16px}

/* Tarjetas Liquid Glass */
.glass{
  background:linear-gradient(145deg,rgba(255,255,255,.58),rgba(255,255,255,.34));
  -webkit-backdrop-filter:blur(36px) saturate(185%);
  backdrop-filter:blur(36px) saturate(185%);
  border:1px solid rgba(255,255,255,.85);
  border-radius:30px;
  box-shadow:
    0 20px 44px rgba(29,29,31,.07),
    inset 0 1.5px 1px rgba(255,255,255,.95),
    inset 0 -1px 1px rgba(255,255,255,.35),
    inset 0 0 24px rgba(255,255,255,.28);
  padding:22px;
}

h1{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;font-size:27px;font-weight:700;letter-spacing:-.025em}
.sub{margin:4px 0 0;color:var(--mut);font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--ladrillo);background:rgba(181,71,43,.12);padding:4px 11px;border-radius:99px;margin-bottom:10px;border:1px solid rgba(181,71,43,.15)}
label,.lb{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:16px 0 6px}

/* Selector segmentado estilo iOS */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:rgba(29,29,31,.06);padding:4px;border-radius:16px;box-shadow:inset 0 1px 2px rgba(0,0,0,.04)}
.seg input{display:none}
.seg label{margin:0;text-align:center;padding:10px 4px;border-radius:12px;font-size:13px;color:var(--tx);cursor:pointer;font-weight:500;transition:all .25s cubic-bezier(.25,.8,.25,1)}
.seg input:checked+label{background:rgba(255,255,255,.92);box-shadow:0 3px 10px rgba(29,29,31,.12),0 1px 2px rgba(29,29,31,.06);color:var(--ladrillo);font-weight:600}

input[type=time],input[type=number]{width:100%;padding:13px 14px;font-size:17px;color:var(--tx);background:rgba(255,255,255,.68);border:1px solid rgba(255,255,255,.85);border-radius:16px;outline:none;font-family:inherit;box-shadow:inset 0 1px 2px rgba(29,29,31,.04);transition:.2s}
input:focus{background:rgba(255,255,255,.92);border-color:var(--ladrillo);box-shadow:0 0 0 3px rgba(181,71,43,.16)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

button,.btn{display:block;width:100%;text-align:center;text-decoration:none;font:600 16px inherit;font-family:inherit;padding:14px;border-radius:18px;border:0;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease}
#go{margin-top:20px;background:linear-gradient(180deg,#23365C,#172440);color:#fff;box-shadow:0 8px 20px rgba(27,42,73,.28),inset 0 1px 0 rgba(255,255,255,.22)}
#go:hover{box-shadow:0 10px 24px rgba(27,42,73,.34),inset 0 1px 0 rgba(255,255,255,.28)}
#go:active{transform:scale(.97)}

#res{display:none;animation:in .4s cubic-bezier(.16,1,.3,1)}@keyframes in{from{opacity:0;transform:translateY(10px) scale(.98)}}
.big{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;font-size:58px;font-weight:700;letter-spacing:-.035em;color:var(--ladrillo);line-height:1}
.big small{font-size:20px;color:var(--mut);font-weight:600;margin-left:6px;letter-spacing:0}
.rng{margin:6px 0 18px;color:var(--mut);font-size:14px}
.bar{position:relative;height:12px;border-radius:99px;background:rgba(29,29,31,.08);box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
.seg2{position:absolute;top:0;bottom:0;border-radius:99px;background:rgba(181,71,43,.35)}
.dot{position:absolute;top:-4px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--ladrillo);border:3px solid #fff;box-shadow:0 2px 8px rgba(181,71,43,.5)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:8px}
#w{display:none;margin-top:14px;padding:10px 12px;border-radius:14px;background:rgba(181,71,43,.14);color:#8A3420;font-size:13px;border:1px solid rgba(181,71,43,.2)}
.info{font-size:12.5px;color:var(--mut);line-height:1.5;margin:0}
.btn{background:rgba(255,255,255,.68);color:var(--ladrillo);border:1px solid rgba(255,255,255,.85);box-shadow:0 4px 12px rgba(29,29,31,.04)}
.btn:hover{background:rgba(255,255,255,.88)}
.btn:active{transform:scale(.98)}
.foot{text-align:center;font-size:11.5px;color:var(--mut);padding:0 8px}

@supports not (backdrop-filter:blur(1px)){.glass{background:rgba(255,255,255,.92)}}
@media(prefers-reduced-motion:reduce){.orb{animation:none!important}}
</style></head><body>

<div class="bg">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<main>
<section class="glass">
  <span class="tag">STAT-DRIVE · UCA</span>
  <h1>¿Cuánto tardo en llegar?</h1>
  <p class="sub">Estimación con tráfico real medido por estudiantes.</p>
  <div class="lb">Tipo de viaje</div>
  <div class="seg">
    <input type="radio" name="t" id="t1" value="ida" checked><label for="t1">Casa - UCA</label>
    <input type="radio" name="t" id="t2" value="regreso"><label for="t2">UCA - Casa</label>
    <input type="radio" name="t" id="t3" value="otra"><label for="t3">Otro</label>
  </div>
  <label for="h">Hora de salida</label><input id="h" type="time" value="06:00">
  <div class="row">
    <div><label for="d">Distancia (km)</label><input id="d" type="number" step="0.1" min="0.5" value="10"></div>
    <div><label for="i">Incidencias</label><input id="i" type="number" min="0" max="10" value="0"></div>
  </div>
  <button id="go" onclick="calc()">Calcular</button>
</section>

<section class="glass" id="res">
  <div class="big"><span id="p">0</span><small>min</small></div>
  <div class="rng" id="rg"></div>
  <div class="bar"><div class="seg2" id="sg"></div><div class="dot" id="dt"></div></div>
  <div class="ends"><span>0</span><span id="mx"></span></div>
  <div id="w"></div>
</section>

<section class="glass">
  <p class="info" id="s">Cargando modelo…</p>
  <a class="btn" id="f" href="https://forms.gle/Pd8U3SRPJoDpBC5h9" style="margin-top:14px">Registrar mi viaje real</a>
</section>
<p class="foot">Proyecto de Probabilidad y Estadística · Datos anónimos</p>
</main>

<script>
let M=null;const $=id=>document.getElementById(id);
fetch("model.json?"+Date.now()).then(r=>r.json()).then(m=>{M=m;info()}).catch(()=>$("s").textContent="No se pudo cargar el modelo.");
function info(){$("s").textContent="Modelo entrenado con "+M.n+" viajes ("+M.n_form+" del formulario). Error medio en validación: "+M.mae_cv.toFixed(1)+" min. Actualizado: "+M.actualizado+"."}
function calc(){
  if(!M)return;
  const [hh,mm]=$("h").value.split(":").map(Number),h=hh+mm/60,d=+$("d").value,i=+$("i").value,t=document.querySelector('input[name=t]:checked').value;
  const y=M.intercepto+M.distancia_km*d+M.hora_salida*h+M.incidencias_n*i+(t==="regreso"?M.es_regreso:0)+(t==="otra"?M.es_otra:0);
  const e=1.645*M.rmse_cv,p=Math.max(1,y),lo=Math.max(1,y-e),hi=y+e,top=Math.max(hi,p)*1.15;
  $("res").style.display="block";$("p").textContent=Math.round(p);
  $("rg").textContent="Rango aproximado: "+Math.round(lo)+" a "+Math.round(hi)+" min (≈90 %)";
  $("sg").style.left=(lo/top*100)+"%";$("sg").style.width=((hi-lo)/top*100)+"%";$("dt").style.left=(p/top*100)+"%";$("mx").textContent=Math.round(top)+" min";
  const w=$("w");
  if(d<M.dist_min||d>M.dist_max){w.style.display="block";w.textContent="Esa distancia está fuera de lo que el modelo ha visto ("+M.dist_min+" a "+M.dist_max+" km). La predicción es poco confiable."}else w.style.display="none";
  $("res").scrollIntoView({behavior:"smooth",block:"nearest"});
}
</script></body></html>
